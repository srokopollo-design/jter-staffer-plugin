name: JterStaffers
version: '1.0.0'
main: com.jter.jterstaffers.JterStaffers
api-version: '1.20'
author: Jter
description: 'JterStaffers - StaffChat, StaffMode, Player Notes'

commands:
  sc:
    description: Send a message to the staff chat
    usage: /sc <message>
  staffmode:
    description: Toggle staff mode
    usage: /staffmode
  vanish:
    description: Toggle vanish
    usage: /vanish
  invsee:
    description: View / edit a player's inventory
    usage: /invsee <player>
  freeze:
    description: Freeze or unfreeze a player
    usage: /freeze <player>
  note:
    description: Manage player notes
    usage: /note [player] [text...]
  jterstaffer:
    description: JterStaffers help / reload
    usage: /jterstaffer [reload]
    aliases: [js]

permissions:
  jterstaffers.staffchat:
    description: Allows use of the staff chat
    default: op
  jterstaffers.staffmode:
    description: Allows use of staff mode and its tools
    default: op
  jterstaffer.notes:
    description: Allows managing player notes
    default: op
  jterstaffers.admin:
    description: Allows use of /jterstaffer (help/reload)
    default: op
